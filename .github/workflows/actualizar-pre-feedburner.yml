name: Actualizar pre-feedburner desde iVoox

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pre-feedburner"
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Añadir el último episodio de iVoox a pre-feedburner
        run: python actualizar-pre-feedburner.py

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add util/pre-feedburner.xml
          if git diff --cached --quiet; then
            echo "No hay episodios nuevos. No se crea commit."
          else
            git commit -m "Añade el último episodio de iVoox a pre-feedburner"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi
