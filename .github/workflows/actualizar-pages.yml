name: Actualizar episodios y publicar en Pages

on:
  schedule:
    # Cada 6 horas (UTC). GitHub puede retrasar la ejecución unos minutos.
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: ["main", "master"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      pages: write
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v5

      - name: Mantener activa la base de datos de Supabase
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import json, pathlib, re, urllib.request

          cfg = pathlib.Path("juegos/juegobsos/config.js").read_text(encoding="utf-8")
          url = re.search(r'supabaseUrl:\s*"([^"]+)"', cfg).group(1).rstrip("/")
          key = re.search(r'supabaseAnonKey:\s*"([^"]+)"', cfg).group(1)
          if not url or not key:
            raise SystemExit("Supabase no configurado; se omite ping.")

          req = urllib.request.Request(
            url + "/rest/v1/rpc/total_partidas",
            data=b"{}",
            headers={
              "apikey": key,
              "Authorization": "Bearer " + key,
              "Content-Type": "application/json",
            },
          )
          with urllib.request.urlopen(req, timeout=20) as r:
            print("Supabase ping OK:", r.read().decode())
          PY

      - name: Configurar Python
        if: github.event_name != 'push'
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Instalar Pillow para optimizar portadas
        if: github.event_name != 'push'
        run: python -m pip install --upgrade Pillow

      - name: Buscar episodios nuevos en iVoox
        if: github.event_name != 'push'
        run: python actualizar.py

      - name: Guardar cambios en el repositorio
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/episodes.js img/episodes img/chapters feed.xml episodes-raw.json sitemap.xml episodios util/pre-feedburner.xml
          git add transcripciones 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No hay episodios nuevos. No se crea commit."
          else
            git commit -m "Actualiza episodios desde el feed de iVoox"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          fi

      - name: Preparar el sitio estático
        run: |
          mkdir -p _site
          cp -r index.html css js img episodios juegos _site/
          mkdir -p _site/transcripciones
          cp transcripciones/*.srt _site/transcripciones/ 2>/dev/null || true
          mkdir -p _site/util
          cp util/pre-feedburner.xml _site/util/
          find . -maxdepth 1 -type f \( -iname "*.html" -o -iname "*.txt" \) -exec cp {} _site/ \;
          cp CNAME sitemap.xml favicon.ico _site/
          touch _site/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v6
        with:
          # Crea el sitio de Pages automáticamente si aún no existe.
          enablement: true

      - name: Subir el sitio como artefacto
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  publicar:
    # Job independiente: deploy-pages consulta el artefacto por nombre y, si se
    # ejecuta justo después de subirlo en el mismo job, la API puede devolver 0
    # artefactos todavía (race condition). Cambiar de job fuerza una espera.
    needs: actualizar
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
